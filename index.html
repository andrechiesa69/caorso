<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindAR - Test Cubo Rosso</title>

    <!-- Script di A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Scena AR: collega il file targets.mind -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target con indice 0 (il primo/unico target nel file .mind) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 
          Cubo Rosso:
          - color: rosso (#FF0000)
          - position: X Y Z (0.5 unità sopra il centro del target)
          - scale: dimensioni del cubo (0.5 x 0.5 x 0.5 metri)
          - animation: una leggera rotazione continua per renderlo più visibile
        -->
        <a-box
          position="0 0.25 0"
          scale="0.5 0.5 0.5"
          material="color: #FF0000; roughness: 0.3; metalness: 0.1;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
        >
        </a-box>
      </a-entity>
    </a-scene>
  </body>
</html>

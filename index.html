<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Tuttocampo - MindAR</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Libreria MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Overlay di caricamento temporaneo */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: center;
      z-index: 99999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading">Inquadra l'immagine/logo...</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Utilizza il file logo.png presente nella repository GitHub -->
      <img id="shieldImg" src="./logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- Fotocamera con cursore per abilitare i tocchi su mobile -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor 
        id="cursor"
        raycaster="objects: .clickable"
        fuse="false"
        material="color: white; shader: flat">
      </a-cursor>
    </a-camera>

    <!-- Target AR (Index 0) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- Scudo/Pulsante Cliccabile -->
      <a-plane 
        id="shieldPlane"
        class="clickable"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const shieldPlane = document.getElementById('shieldPlane');

      // Nasconde la scritta di caricamento non appena MindAR è pronto
      sceneEl.addEventListener("arReady", () => {
        loadingEl.style.display = "none";
      });

      // Sicurezza extra: nasconde comunque la scritta dopo 3 secondi dall'avvio
      setTimeout(() => {
        if (loadingEl) loadingEl.style.display = "none";
      }, 3000);

      // Reindirizzamento al sito Tuttocampo al click sullo scudo
      shieldPlane.addEventListener('click', () => {
        window.location.href = "https://www.tuttocampo.it";
      });
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR US Caorso - Tuttocampo</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Libreria MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Badge di stato in alto */
    #status-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 99999;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="status-msg">Avvio fotocamera...</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- File logo.png presente nella repo -->
      <img id="shieldImg" src="./logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- Fotocamera con raycaster per intercettare i tocchi -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor 
        id="cursor"
        raycaster="objects: .clickable"
        fuse="false"
        material="color: white; shader: flat">
      </a-cursor>
    </a-camera>

    <!-- Target AR (Index 0) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- Logo Cliccabile in Realtà Aumentata -->
      <a-plane 
        id="shieldPlane"
        class="clickable"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const statusMsg = document.getElementById('status-msg');
      const shieldPlane = document.getElementById('shieldPlane');
      const targetEntity = document.getElementById('targetEntity');

      let isTargetVisible = false;
      const targetUrl = "https://www.tuttocampo.it/EmiliaRomagna/IT/Squadra/Caorso/920807";

      // Fotocamera pronta
      sceneEl.addEventListener("arReady", () => {
        statusMsg.innerText = "Inquadra l'immagine target";
      });

      // Errore caricamento file .mind
      sceneEl.addEventListener("arError", () => {
        statusMsg.style.color = "#ff4d4d";
        statusMsg.innerText = "Errore: verifica il file 'targets.mind'!";
      });

      // Riconoscimento del target
      targetEntity.addEventListener("targetFound", () => {
        isTargetVisible = true;
        statusMsg.innerText = "Tocca il logo sullo schermo per aprire la pagina!";
      });

      // Target perso
      targetEntity.addEventListener("targetLost", () => {
        isTargetVisible = false;
        statusMsg.innerText = "Inquadra l'immagine target";
      });

      // Metodo 1: Click 3D diretto sul piano del logo
      shieldPlane.addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = targetUrl;
      });

      // Metodo 2: Tocco touch generico quando l'immagine AR è visibile a schermo
      window.addEventListener('click', () => {
        if (isTargetVisible) {
          window.location.href = targetUrl;
        }
      });

      window.addEventListener('touchstart', () => {
        if (isTargetVisible) {
          window.location.href = targetUrl;
        }
      }, { passive: true });
    });
  </script>

</body>
</html>

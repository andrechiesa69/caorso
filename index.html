<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.S.D. Caorso - WebAR Experience</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Stile per l'anteprima dell'SVG target se si apre la pagina da browser desktop */
    #svg-target-preview {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      max-width: 120px;
    }
  </style>
</head>
<body>

  <!-- ANTEPRIMA SVG TARGET (Visualizzabile a schermo) -->
  <div id="svg-target-preview">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
      <defs>
        <!-- Pattern a scacchi ad alto contrasto per i Feature Points di MindAR -->
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#002b66"/>
          <rect x="10" width="10" height="10" fill="#d00000"/>
          <rect y="10" width="10" height="10" fill="#ffffff"/>
          <rect x="10" y="10" width="10" height="10" fill="#111111"/>
        </pattern>
      </defs>

      <!-- Sfondo con Pattern -->
      <rect width="500" height="500" fill="url(#grid)" />
      
      <!-- Cornice ad alto contrasto -->
      <rect x="15" y="15" width="470" height="470" fill="none" stroke="#ffffff" stroke-width="8" />
      <rect x="25" y="25" width="450" height="450" fill="none" stroke="#d00000" stroke-width="6" stroke-dasharray="12,6" />

      <!-- Cerchio Centrale Logo -->
      <circle cx="250" cy="250" r="160" fill="#ffffff" stroke="#002b66" stroke-width="10" />

      <!-- Scritta ASD CAORSO -->
      <path id="textArc" d="M 120,250 A 130,130 0 0,1 380,250" fill="none" />
      <text font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002b66" text-anchor="middle">
        <textPath href="#textArc" startOffset="50%">A.S.D. CAORSO</textPath>
      </text>

      <!-- Dettaglio Portiere / Pallone -->
      <circle cx="250" cy="240" r="35" fill="#111111" stroke="#ffffff" stroke-width="3" />
      <polygon points="250,210 262,222 258,238 242,238 238,222" fill="#ffffff" />
      <path d="M 180,310 L 220,270 L 250,285 L 280,270 L 320,310 Z" fill="#d00000" stroke="#002b66" stroke-width="4" />

      <!-- Marcatori angolari per aggancio camera -->
      <polygon points="30,30 70,30 30,70" fill="#ffffff" />
      <polygon points="470,30 430,30 470,70" fill="#ffffff" />
      <polygon points="30,470 70,470 30,430" fill="#ffffff" />
      <polygon points="470,470 430,470 470,430" fill="#ffffff" />
    </svg>
  </div>

  <!-- SCENA AR CON MINDAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Oggetti 3D associati al target -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Cubo Rosso che ruota -->
      <a-box 
        position="0 0.2 0" 
        rotation="0 45 0" 
        scale="0.4 0.4 0.4"
        material="color: #d00000;" 
        animation="property: rotation; to: 0 405 0; dur: 4000; easing: linear; loop: true">
      </a-box>
      
      <!-- Sfera Blu -->
      <a-sphere 
        position="0 0.7 0" 
        radius="0.15" 
        material="color: #002b66;">
      </a-sphere>
    </a-entity>
  </a-scene>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Tuttocampo - MindAR</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Libreria MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Messaggio di caricamento iniziale */
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 16px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading">Caricamento fotocamera e AR...</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Immagine dello Scudo / Logo Tuttocampo -->
      <img id="shieldImg" src="https://www.tuttocampo.it/Web/Images/Header/logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- Fotocamera con Raggio Laser/Cursore per il Click su Mobile/Desktop -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor 
        id="cursor"
        raycaster="objects: .clickable"
        fuse="false"
        material="color: white; shader: flat">
      </a-cursor>
    </a-camera>

    <!-- Target AR (Agganciato all'immagine 0 del file targets.mind) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- Scudo / Pulsante Cliccabile -->
      <a-plane 
        id="shieldPlane"
        class="clickable"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        transparent="true">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const shieldPlane = document.getElementById('shieldPlane');
      const targetEntity = document.getElementById('targetEntity');

      // Nasconde il loader quando la scena AR è pronta
      sceneEl.addEventListener('render-start', () => {
        loadingEl.style.display = 'none';
      });

      // Evento quando l'immagine/barcode viene inquadrata
      targetEntity.addEventListener("targetFound", () => {
        console.log("Barcode rilevato!");
      });

      // Evento quando l'immagine viene persa dalla fotocamera
      targetEntity.addEventListener("targetLost", () => {
        console.log("Barcode perso dal campo visivo.");
      });

      // Azione al CLICK sullo scudo
      shieldPlane.addEventListener('click', () => {
        // Reindirizza al sito Tuttocampo
        window.location.href = "https://www.tuttocampo.it";
      });
    });
  </script>

</body>
</html>

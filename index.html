<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A.S.D. Caorso - WebAR Experience</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Pulsante interattivo Tuttocampo */
    #tuttocampo-btn {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background-color: #002b66;
      color: #ffffff;
      padding: 14px 28px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #ffffff;
      border-radius: 30px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    #tuttocampo-btn:active {
      background-color: #d00000;
    }
  </style>
</head>
<body>

  <!-- Pulsante di reindirizzamento alla scheda dell'A.S.D. Caorso -->
  <a id="tuttocampo-btn" href="https://www.tuttocampo.it/EmiliaRomagna/SecondaCategoria/GironeBParma/Squadra/Caorso/1000541/Scheda" target="_blank">
    ⚽ VAI ALLA SCHEDA A.S.D. CAORSO
  </a>

  <!-- SCENA AR MINDAR (Ottimizzata per Safari / iOS) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: true">
    
    <a-assets>
      <!-- Logo da mostrare sul target -->
      <img id="logoCaorso" src="./logo.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" raycaster="objects: .clickable" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <!-- TARGET AR -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- Logo in AR fisso e statico -->
      <a-plane 
        class="clickable"
        src="#logoCaorso" 
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    const targetEntity = document.querySelector('#targetEntity');
    const tuttocampoBtn = document.querySelector('#tuttocampo-btn');
    const arPlane = document.querySelector('.clickable');
    const caorsoUrl = 'https://www.tuttocampo.it/EmiliaRomagna/SecondaCategoria/GironeBParma/Squadra/Caorso/1000541/Scheda';

    // Riconoscimento del target
    targetEntity.addEventListener("targetFound", () => {
      tuttocampoBtn.style.display = "block";
    });

    // Perdita del target
    targetEntity.addEventListener("targetLost", () => {
      tuttocampoBtn.style.display = "none";
    });

    // Clic sul logo AR
    arPlane.addEventListener('click', function () {
      window.open(caorsoUrl, '_blank');
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR A.S.D. Caorso - Tuttocampo</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Libreria MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Badge di stato in alto */
    #status-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 99999;
      text-align: center;
      pointer-events: none;
    }

    /* Pulsante d'azione 2D per il reindirizzamento sicuro su Mobile */
    #action-btn {
      display: none; /* Nascosto di default */
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0056b3;
      color: white;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
      border-radius: 30px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 999999;
      cursor: pointer;
      text-decoration: none;
    }

    #action-btn:active {
      background-color: #003d80;
    }
  </style>
</head>
<body>

  <div id="status-msg">Avvio fotocamera...</div>
  
  <!-- Pulsante reale HTML per garantire il click su Safari/iOS -->
  <button id="action-btn">Vai alla pagina A.S.D. Caorso ➔</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="shieldImg" src="./logo.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target AR (Index 0) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <a-plane 
        id="shieldPlane"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const statusMsg = document.getElementById('status-msg');
      const actionBtn = document.getElementById('action-btn');
      const targetEntity = document.getElementById('targetEntity');

      const targetUrl = "https://www.tuttocampo.it/EmiliaRomagna/IT/Squadra/Caorso/920807";

      // Quando il sistema AR è pronto
      sceneEl.addEventListener("arReady", () => {
        statusMsg.innerText = "Inquadra il logo A.S.D. Caorso";
      });

      // Target Trovato: mostra il pulsante in basso per il click sicuro
      targetEntity.addEventListener("targetFound", () => {
        statusMsg.innerText = "Logo Trovato!";
        actionBtn.style.display = "block";
      });

      // Target Perso: nasconde il pulsante
      targetEntity.addEventListener("targetLost", () => {
        statusMsg.innerText = "Inquadra il logo A.S.D. Caorso";
        actionBtn.style.display = "none";
      });

      // Click sul pulsante 2D (funziona al 100% su iOS Safari)
      actionBtn.addEventListener('click', () => {
        window.location.href = targetUrl;
      });
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Caorso - Facebook</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Avviso discreto in alto */
    #status-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #00ffcc;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 99999;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="status-msg">Avvio fotocamera...</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="shieldImg" src="./logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- Fotocamera con raycaster per intercettare il tocco sul logo -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor 
        id="cursor"
        raycaster="objects: .clickable"
        fuse="false"
        material="color: white; shader: flat; opacity: 0;">
      </a-cursor>
    </a-camera>

    <!-- Target AR -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- Logo 3D Cliccabile -->
      <a-plane 
        id="shieldPlane"
        class="clickable"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const statusMsg = document.getElementById('status-msg');
      const shieldPlane = document.getElementById('shieldPlane');
      const targetEntity = document.getElementById('targetEntity');

      // Nuova destinazione: Pagina Facebook ASD Caorso Calcio
      const targetUrl = "https://facebook.com/people/ASD-Caorso-Calcio/100083386797167/";
      let isTargetVisible = false;

      // Fotocamera pronta
      sceneEl.addEventListener("arReady", () => {
        statusMsg.innerText = "Inquadra il logo";
      });

      // Target Trovato
      targetEntity.addEventListener("targetFound", () => {
        isTargetVisible = true;
        statusMsg.innerText = "Logo Trovato! Toccalo per aprire Facebook";
      });

      // Target Perso
      targetEntity.addEventListener("targetLost", () => {
        isTargetVisible = false;
        statusMsg.innerText = "Inquadra il logo";
      });

      // 1. Click diretto sul logo AR
      shieldPlane.addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = targetUrl;
      });

      // 2. Toccare lo schermo mentre il logo AR è visibile
      window.addEventListener('click', () => {
        if (isTargetVisible) {
          window.location.href = targetUrl;
        }
      });

      window.addEventListener('touchstart', () => {
        if (isTargetVisible) {
          window.location.href = targetUrl;
        }
      }, { passive: true });
    });
  </script>

</body>
</html>

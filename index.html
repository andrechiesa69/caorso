<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Tuttocampo - MindAR</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Libreria MindAR per A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Messaggio overlay durante il caricamento */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 18px;
      z-index: 99999;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div id="loading">Caricamento fotocamera e AR in corso...<br><br>Consenti l'accesso alla fotocamera se richiesto.</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Immagine dello Scudo / Logo Tuttocampo -->
      <img id="shieldImg" src="https://www.tuttocampo.it/Web/Images/Header/logo.png" crossorigin="anonymous">
    </a-assets>

    <!-- Fotocamera con cursore abilitato per i tocchi su schermi mobile -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor 
        id="cursor"
        raycaster="objects: .clickable"
        fuse="false"
        material="color: white; shader: flat">
      </a-cursor>
    </a-camera>

    <!-- Target AR (Corrisponde all'immagine con indice 0) -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- Scudo/Pulsante Cliccabile -->
      <a-plane 
        id="shieldPlane"
        class="clickable"
        src="#shieldImg"
        position="0 0 0" 
        height="1" 
        width="1" 
        rotation="0 0 0"
        material="transparent: true; alphaTest: 0.5;">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const shieldPlane = document.getElementById('shieldPlane');

      // Rimuove il loader non appena MindAR ha avviato la fotocamera
      sceneEl.addEventListener("arReady", () => {
        loadingEl.style.display = "none";
      });

      // Gestione errori di avvio (es. file .mind non trovato o fotocamera bloccata)
      sceneEl.addEventListener("arError", (event) => {
        loadingEl.innerHTML = "<span style='color: #ff6b6b;'>Errore nell'avvio dell'AR.</span><br>Verifica che il file <b>targets.mind</b> sia presente su GitHub e di aver concesso i permessi per la fotocamera.";
      });

      // Azione al click/tap sullo scudo
      shieldPlane.addEventListener('click', () => {
        window.location.href = "https://www.tuttocampo.it";
      });
    });
  </script>

</body>
</html>
